attributes:
  - name: firmwareVersion
    oid: [UPS-MIB, upsIdentUPSSoftwareVersion, 0]
    polling_period: .inf

  - name: model
    oid: [UPS-MIB, upsIdentModel, 0]
    polling_period: .inf

  - name: systemDescription
    oid: [SNMPv2-MIB, sysDescr, 0]
    polling_period: .inf

  - name: batteryStatus
    oid: [UPS-MIB, upsBatteryStatus, 0]
    polling_period: 10000

  - name: batteryVoltage
    oid: [UPS-MIB, upsBatteryVoltage, 0]
    polling_period: 10000

  #- name: batteryCurrent
  #  oid: [UPS-MIB, upsBatteryCurrent, 0]
  #  polling_period: 10000

  - name: batteryTemperature
    oid: [UPS-TEMP-MIB, upsBatteryTemperature]
    polling_period: 10000

  - name: inputFrequency
    oid: [UPS-MIB, upsInputFrequency, 1]
    polling_period: 10000

  - name: input{}Voltage
    indexes:
      - [1, 3]
    oid: [UPS-MIB, upsInputVoltage]
    polling_period: 10000

  - name: input{}Current
    indexes:
      - [1, 3]
    oid: [UPS-MIB, upsInputCurrent]
    polling_period: 10000

  - name: outputSource
    oid: [UPS-MIB, upsOutputSource, 0]
    polling_period: 10000

  - name: outputFrequency
    oid: [UPS-MIB, upsOutputFrequency, 0]
    polling_period: 10000

  - name: output{}Voltage
    indexes:
      - [1, 3]
    oid: [UPS-MIB, upsOutputVoltage]
    polling_period: 10000

  - name: output{}Current
    indexes:
      - [1, 3]
    oid: [UPS-MIB, upsOutputCurrent]
    polling_period: 10000

  - name: remainingRunTime
    oid: [UPS-MIB, upsEstimatedMinutesRemaining, 0]
    polling_period: 10000

  - name: batteryCharge
    oid: [UPS-MIB, upsEstimatedChargeRemaining, 0]
    polling_period: 10000
